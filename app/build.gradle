plugins {
    id 'com.android.application'

//    id 'com.google.gms.google-services'
}

android {
    namespace 'com.photofusion.holi.videomaker.photo.slideshow'
    compileSdk 36

    defaultConfig {
        applicationId "com.photofusion.holi.videomaker.photo.slideshow"

        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        dataBinding = true
        buildConfig = true
    }


}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation project(':imageeditlibrary')
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

//    implementation 'com.arthenica:ffmpeg-kit-full:4.5.1-1'
    implementation 'com.arthenica:ffmpeg-kit-min-gpl:6.0-2'
//    implementation 'com.arthenica:mobile-ffmpeg-min:4.4'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.google.android.material:material:1.12.0'



    testImplementation 'junit:junit:4.13.2'
    implementation 'com.airbnb.android:lottie:6.6.2'

    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation files('libs/commons-io-2.4.jar')
    implementation files('libs/nineoldandroids-2.4.0.jar')
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'com.onesignal:OneSignal:[5.0.0, 5.99.99]'
    implementation "androidx.multidex:multidex:2.0.1"

    /*ironsource*/
    implementation 'com.ironsource.sdk:mediationsdk:8.5.0'

    // Add Facebook Network
    implementation 'com.ironsource.adapters:facebookadapter:4.3.51'

    implementation 'com.google.android.gms:play-services-appset:16.1.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.3.0'
    implementation 'com.google.android.gms:play-services-basement:18.5.0'

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
    implementation "androidx.lifecycle:lifecycle-common-java8:2.8.7"

    // Billing
    implementation 'com.android.billingclient:billing:7.2.0'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.firebase:firebase-crashlytics-buildtools:3.0.2'

    implementation platform('com.google.firebase:firebase-bom:34.9.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    //arr
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation "com.github.skydoves:androidribbon:1.0.4"
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'com.android.volley:volley:1.2.1'

    //Charboost
    implementation 'com.google.ads.mediation:chartboost:9.8.0.0'

    //FaceBook
    implementation 'com.google.ads.mediation:facebook:6.18.0.0'

    // Add AdColony Network
    implementation 'com.ironsource.adapters:adcolonyadapter:4.3.16'
    implementation 'com.adcolony:sdk:4.8.0'

    // Add Facebook Network
    implementation 'com.ironsource.adapters:facebookadapter:4.3.51'
    implementation 'com.facebook.android:audience-network-sdk:6.18.0'

}

