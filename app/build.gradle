plugins {
    id 'com.android.application'

//    id 'com.google.gms.google-services'
}

android {
    namespace 'com.photofusion.holi.videomaker.photo.slideshow'
    compileSdk 36

    defaultConfig {
        applicationId "com.photofusion.holi.videomaker.photo.slideshow"

        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        dataBinding = true
        buildConfig = true
    }


}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation project(':imageeditlibrary')
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'

//    implementation 'com.arthenica:ffmpeg-kit-full:4.5.1-1'
//    implementation 'com.arthenica:ffmpeg-kit-min-gpl:5.1' // Removed - using native Android MediaCodec/MediaMuxer
//    implementation 'com.arthenica:mobile-ffmpeg-min:4.4'
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.5'
    implementation 'com.google.android.material:material:1.13.0'



    testImplementation 'junit:junit:4.13.2'
    implementation 'com.airbnb.android:lottie:6.7.1'

    implementation 'com.google.android.gms:play-services-ads:24.9.0'
    implementation files('libs/commons-io-2.4.jar')
    implementation files('libs/nineoldandroids-2.4.0.jar')
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'com.onesignal:OneSignal:5.6.1'
    implementation "androidx.multidex:multidex:2.0.1"

    implementation 'com.google.android.gms:play-services-appset:16.1.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.3.0'
    implementation 'com.google.android.gms:play-services-basement:18.10.0'

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.10.0"
    implementation 'androidx.lifecycle:lifecycle-process:2.10.0'
    implementation "androidx.lifecycle:lifecycle-common-java8:2.10.0"

    // Billing
    implementation 'com.android.billingclient:billing:8.3.0'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.firebase:firebase-crashlytics-buildtools:3.0.6'

    implementation platform('com.google.firebase:firebase-bom:34.9.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    //arr
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation "com.github.skydoves:androidribbon:1.0.4"
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'com.android.volley:volley:1.2.1'

    //FaceBook
    implementation 'com.google.ads.mediation:facebook:6.21.0.1'

    // AdColony SDK (keep standalone, not IronSource adapter)
    implementation 'com.adcolony:sdk:4.8.0'

    // Facebook Audience Network (keep standalone, not IronSource adapter)
    implementation 'com.facebook.android:audience-network-sdk:6.21.0'
}
